<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI LEGENDS</title>
<style>
:root{--bg:#07061a;--card:#100e2b;--line:#2a2658;--tx:#eceaff;--mu:#9a96c9;--g:linear-gradient(135deg,#7c3aed,#2563ff,#06d6f2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#07061a}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:radial-gradient(60% 40% at 80% -5%,#4c1d9566,transparent),radial-gradient(50% 40% at 0 10%,#0891b244,transparent),var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:#07061acc;border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo{font-weight:800;letter-spacing:.08em}.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:18px;color:var(--mu);font-size:14px}.links a:hover{color:#fff}
.btn{display:inline-block;border:0;cursor:pointer;color:#fff;font:600 15px inherit;font-family:inherit;padding:12px 22px;border-radius:12px;background:var(--g);box-shadow:0 8px 30px #6d28d955;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px #2563ff88}
.btn.o{background:transparent;border:1px solid var(--line);box-shadow:none}.btn.o:hover{border-color:#06d6f2}
.hero{text-align:center;padding:80px 0 50px}
h1{font-size:clamp(34px,7vw,66px);line-height:1.08;font-weight:800;margin-bottom:18px}
h1 span,h2 span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);max-width:620px;margin:0 auto 28px;font-size:18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
section{padding:50px 0}h2{font-size:clamp(26px,4vw,38px);margin-bottom:8px}.lead{color:var(--mu);margin-bottom:26px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:linear-gradient(160deg,#16133a,var(--card));border:1px solid var(--line);border-radius:18px;padding:18px;transition:.25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:var(--c1);box-shadow:0 14px 40px -12px var(--c1)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:12px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.card h3{font-size:16px;letter-spacing:.04em}.card p{color:var(--mu);font-size:14px;margin-top:4px}
.tag{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin:8px 4px 0 0}
.plans{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.plan.hot{border-color:#06d6f2;box-shadow:0 0 40px -10px #06d6f2}
.price{font-size:26px;font-weight:800;margin:6px 0}.plan ul{list-style:none;padding:0;margin:10px 0 16px;color:var(--mu);font-size:14px}.plan li{padding:3px 0}.plan li:before{content:"✓ ";color:#06d6f2}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin-top:8px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mu);font-size:14px;text-align:center}
/* app */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 12px;background:#0a0922;position:sticky;top:0;height:100vh;overflow:auto}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);margin-top:4px}aside a.on,aside a:hover{background:#1c1850;color:#fff}
main{padding:22px 18px 90px;min-width:0}
.stat{height:8px;background:#1c1850;border-radius:9px;overflow:hidden;margin-top:8px}.stat i{display:block;height:100%;background:var(--g)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 60px);max-width:820px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.m{max-width:88%;padding:12px 15px;border-radius:16px;word-wrap:break-word}.m.u{align-self:flex-end;background:var(--g)}.m.a{background:var(--card);border:1px solid var(--line)}
.m pre{background:#05041299;border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0;font-size:13px}.m code{font-family:ui-monospace,monospace}
.bar{display:flex;gap:8px}.bar input{flex:1;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:12px;padding:13px;font:inherit;min-width:0}.bar input:focus{outline:0;border-color:#06d6f2}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:9px;background:#06d6f2;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2;transform:translateY(-4px)}}
.bn{display:none}
@media(max-width:760px){.links{display:none}.app{display:block}aside{display:none}
.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:#0a0922f2;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:6;justify-content:space-around}
.bn a{font-size:12px;color:var(--mu);text-align:center}.bn a.on{color:#06d6f2}.chat{height:calc(100vh - 150px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="r"></div>
<script>
const A=[
["WRITER","✍️","Rédaction, correction et reformulation","#7c3aed","#c026d3",["Corriger un texte","Reformuler un mail"]],
["DEVELOPER","💻","Programmation et développement","#2563ff","#06d6f2",["Déboguer du code","Créer une fonction"]],
["BUSINESS","📈","Création et développement d'entreprise","#059669","#34d399",["Business plan","Étude de marché"]],
["MARKETING","📣","Marketing, publicité, stratégie commerciale","#e11d48","#fb923c",["Slogans","Plan de campagne"]],
["DESIGNER","🎨","Idées créatives et direction artistique","#c026d3","#f472b6",["Palette de couleurs","Idées de logo"]],
["STUDENT","🎓","Apprentissage et aide aux études","#0891b2","#67e8f9",["Fiche de révision","Expliquer un cours"]],
["RESEARCHER","🔬","Recherche et analyse","#4f46e5","#a78bfa",["Synthèse de sources","Plan de recherche"]],
["ASSISTANT","🤖","Assistant personnel polyvalent","#2563ff","#a78bfa",["Organiser ma semaine","Préparer un voyage"]],
["ANALYST","📊","Analyse de données et aide à la décision","#d97706","#fcd34d",["Lire un tableau","Comparer des options"]],
["AUTOMATION","⚡","Workflows et automatisations","#7c3aed","#06d6f2",["Concevoir un workflow","Relier des outils"]]
].map((a,i)=>({id:i,name:"AI "+a[0],ic:a[1],d:a[2],c1:a[3],c2:a[4],ex:a[5]}));
const P=[["BASIC","0 €","Découverte",["2 agents","20 messages / jour","Historique 7 jours"]],
["PREMIUM","— €","Utilisateurs réguliers",["5 agents","200 messages / jour","Historique 30 jours"]],
["GOLD","— €","Utilisateurs avancés",["10 agents","Messages étendus","Historique illimité"]],
["DIAMOND","— €","Utilisateurs exigeants",["Tous les agents","Limites élevées","Support dédié"]],
["LÉGENDE","— €","La formule complète",["Accès prioritaire","Fonctions avancées","Nouveautés en avance"]]];
const F=[["Les agents répondent-ils déjà ?","Uniquement si l'administrateur a connecté un modèle IA côté serveur ; sinon le chat l'indique clairement."],
["Les paiements fonctionnent-ils ?","Par PayPal uniquement. Votre paiement est vérifié manuellement avant activation, et le renouvellement est manuel."],
["Peut-on commencer gratuitement ?","Oui, la formule BASIC est prévue à 0 €."]];
const hist=[];let cur=null,busy=false;
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>').replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,(m)=>m.replace(/<br>/g,'\n'))}
const sty=a=>`style="--c1:${a.c1};--c2:${a.c2}"`;
const agentCard=(a,h)=>`<a class="card" href="${h}" ${sty(a)}><div class="ic">${a.ic}</div><h3>${a.name}</h3><p>${a.d}</p>${a.ex.map(e=>`<span class="tag">${e}</span>`).join("")}</a>`;
function landing(){return `<nav><div class="w"><a class="logo" href="#/">AI <b>LEGENDS</b></a><div class="links"><a href="#agents">Agents</a><a href="#why">Avantages</a><a href="#plans">Abonnements</a><a href="#faq">FAQ</a></div><a class="btn" href="#/app">Dashboard</a></div></nav>
<div class="w"><div class="hero"><h1>One platform.<br><span>Infinite intelligence.</span></h1><p class="sub">Choisissez l'agent IA adapté à votre tâche, discutez avec lui et avancez, depuis un seul espace pensé pour mobile, tablette et ordinateur.</p><div class="cta"><a class="btn" href="#agents">Découvrir les agents</a><a class="btn o" href="#/app">Commencer gratuitement</a></div></div>
<section id="agents"><h2>10 agents, <span>10 spécialités</span></h2><p class="lead">Chacun a son identité, ses exemples de tâches et son espace de discussion.</p><div class="grid">${A.map(a=>agentCard(a,"#/chat/"+a.id)).join("")}</div></section>
<section id="why"><h2>Pourquoi <span>AI LEGENDS</span></h2><p class="lead">&nbsp;</p><div class="grid">${[["🧭","Un point d'entrée unique","Tous vos agents au même endroit."],["🔐","Clés API protégées","Prévu : un backend garde les clés, jamais le navigateur."],["📱","Adapté partout","Navigation basse sur mobile, menu latéral sur grand écran."]].map(x=>`<div class="card" style="--c1:#7c3aed"><div class="ic" style="--c1:#7c3aed;--c2:#06d6f2">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div></section>
<section id="plans"><h2>Cinq <span>formules</span></h2><p class="lead">Paiement par PayPal uniquement. Activation après vérification manuelle, renouvellement manuel (pas de prélèvement automatique).</p><div class="grid plans">${plans()}</div></section>
<section id="faq"><h2>FAQ</h2><p class="lead">&nbsp;</p>${F.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</section></div>
<footer>© 2026 AI LEGENDS · Prix en € · TVA non applicable, art. 293 B du CGI (à adapter selon votre statut) · <a href="#/app">Dashboard</a></footer>`}
function plans(){return''}
function shell(on,body){const l=[["#/app","🏠","Accueil","home"],["#/agents","🧩","Agents","ag"],["#/history","🕘","Historique","hi"],["#/account","👤","Compte","ac"]];
const n=cl=>l.map(x=>`<a href="${x[0]}" class="${x[3]==on?"on":""}">${cl?x[1]+"<br>":x[1]+" "}${x[2]}</a>`).join("");
return `<div class="app"><aside><a class="logo" href="#/" style="display:block;margin-bottom:14px">AI <b>LEGENDS</b></a>${n(0)}</aside><main>${body}</main></div><div class="bn">${n(1)}</div>`}
function home(){return shell("home",`<h2>Bienvenue 👋</h2><p class="lead">Choisissez un agent pour démarrer une discussion.</p><div class="grid">${A.slice(0,4).map(a=>agentCard(a,"#/chat/"+a.id)).join("")}</div><h2 style="margin-top:28px;font-size:22px">Récents</h2>${recent()}`)}
function recent(){return hist.length?hist.slice(-3).reverse().map(h=>`<p><a href="#/chat/${h.a}">${A[h.a].ic} ${esc(h.t)}</a></p>`).join(""):'<p class="lead">Aucune conversation pour l\'instant.</p>'}
function agents(){return shell("ag",`<h2>Agents</h2><p class="lead">Les 10 agents disponibles.</p><div class="grid">${A.map(a=>agentCard(a,"#/chat/"+a.id)).join("")}</div>`)}
function history(){return shell("hi",`<h2>Historique</h2><p class="lead">Conservé uniquement pendant cette session (pas de base de données encore).</p>${recent()}`)}
function account(){return shell("ac",`<h2>Compte</h2><p class="lead">Connexion et profils : à venir (auth + base de données).</p><div class="card" style="--c1:#06d6f2;max-width:420px"><h3>Abonnement : BASIC</h3><p>Utilisation du jour (exemple d'affichage, sans compteur réel)</p><div class="stat"><i style="width:0%"></i></div><p style="margin-top:6px">0 / 20 messages</p></div><h2 style="margin-top:28px;font-size:22px">Formules</h2><div class="grid plans">${plans()}</div>`)}
function chat(id){const a=A[id];if(!a)return home();cur=id;
return shell("ag",`<div class="chat"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px" ${sty(a)}><div class="ic" style="margin:0">${a.ic}</div><div><h3>${a.name}</h3><p style="color:var(--mu);font-size:13px">${a.d}</p></div><button class="btn o" style="margin-left:auto;padding:8px 12px" onclick="reset()">+ Nouveau</button></div><div class="msgs" id="ms"><div class="m a">${md("Bonjour, je suis **"+a.name+"**. Essayez : "+a.ex.join(" · "))}</div></div><form class="bar" onsubmit="send(event)"><input id="in" placeholder="Écrivez à ${a.name}…" autocomplete="off" aria-label="Message"><button class="btn" id="sd">Envoyer</button></form></div>`)}
function reset(){route()}
function add(c,h){const d=document.createElement("div");d.className="m "+c;d.innerHTML=h;$("#ms").append(d);d.scrollIntoView({block:"end"});return d}
function send(e){e.preventDefault();const i=$("#in"),t=i.value.trim();if(!t||busy)return;i.value="";busy=true;
add("u",md(t));hist.push({a:cur,t:t.slice(0,60)});const w=add("a",'<span class="dots"><i></i><i></i><i></i></span>');
setTimeout(()=>{w.innerHTML=md("⚠️ **Aucun modèle IA n'est connecté** pour le moment, donc je ne peux pas répondre vraiment.\n\nArchitecture prévue :\n```\nNavigateur → /api/chat (backend) → API IA\n```\nLes clés API resteront côté serveur. L'affichage `Markdown` et du code fonctionne déjà.");busy=false},900)}
function route(){const h=location.hash||"#/";const r=$("#r");let p=h.split("/");
const v=h==="#/app"?home():h==="#/agents"?agents():h==="#/history"?history():h==="#/account"?account():p[1]==="chat"?chat(+p[2]):landing();
r.innerHTML=v;if(!/^#(agents|why|plans|faq)$/.test(h))scrollTo(0,0)}
addEventListener("hashchange",()=>{if(/^#(agents|why|plans|faq)$/.test(location.hash))return;route()});route();
</script><script>
let S={u:null,pl:null,ai:false},cm=[];
const api=async(p,o)=>{const x=await fetch('/api/'+p,o?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}:{});const j=await x.json().catch(()=>({}));if(!x.ok)throw new Error(j.error||'Erreur '+x.status);return j};
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const dt=t=>t?new Date(t).toLocaleDateString('fr-FR'):'—';
function modal(h){let m=$('#md');if(!m){m=document.createElement('div');m.id='md';m.style.cssText='position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:16px';document.body.append(m)}
m.innerHTML=`<div class="card" style="--c1:#06d6f2;max-width:420px;width:100%;max-height:90vh;overflow:auto">${h}<p><a href="#" onclick="closeM();return false" style="color:var(--mu)">Fermer</a></p></div>`}
function closeM(){const m=$('#md');if(m)m.remove()}
function authM(msg){modal(`<h3>Connexion / Inscription</h3><p style="color:#fb923c">${msg||''}</p><div style="display:grid;gap:8px;margin:10px 0"><input id="ae" type="email" placeholder="Email" class="bar" style="padding:12px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:12px"><input id="ap" type="password" placeholder="Mot de passe (8+ caractères)" style="padding:12px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:12px"></div><button class="btn" onclick="auth('login')">Connexion</button> <button class="btn o" onclick="auth('register')">Créer un compte</button>`)}
async function auth(a){try{const j=await api('auth?a='+a,{email:$('#ae').value,password:$('#ap').value});S.u=j.user;closeM();route()}catch(e){authM(e.message)}}
async function logout(){await api('auth?a=logout',{});S.u=null;location.hash='#/';route()}
plans=function(){if(!S.pl)return'<p class="lead">Chargement…</p>';return Object.entries(S.pl).map(([k,v])=>`<div class="card plan ${k=='gold'?'hot':''}" style="--c1:#7c3aed">${k=='gold'?'<span class="tag">Meilleur rapport</span>':''}<h3>${v.name}</h3><div class="price">${v.price?eur(v.price)+'<small style="font-size:14px"> /mois</small>':'Gratuit'}</div><ul><li>${v.agents} agents inclus</li><li>${v.daily} messages / jour</li>${v.price?'<li>Paiement PayPal, renouvellement manuel</li>':''}</ul><button class="btn ${v.price?'':'o'}" onclick="pick('${k}')">${v.price?'Choisir '+v.name:'Commencer'}</button></div>`).join('')};
async function pick(k){if(!S.u)return authM('Connectez-vous pour choisir une formule.');const v=S.pl[k];if(!v.price){location.hash='#/app';return}
try{const j=await api('pay',{plan:k});const p=j.payment;modal(`<h3>Récapitulatif</h3><p>Formule <b>${v.name}</b> · 30 jours<br>Montant à payer : <b>${eur(p.amount)}</b><br>Référence : <b>${p.ref}</b></p><p style="color:var(--mu);font-size:14px;margin:10px 0">1) Payez via PayPal en indiquant la référence dans la note.<br>2) L'administrateur vérifie le paiement, puis active votre formule. Revenir de PayPal n'active rien automatiquement.<br>Le renouvellement est manuel (pas d'abonnement récurrent automatique).</p><a class="btn" href="${j.url}" target="_blank" rel="noopener">Payer avec PayPal</a>`)}catch(e){modal('<p>'+esc(e.message)+'</p>')}}
account=function(){if(!S.u)return shell('ac',`<h2>Compte</h2><p class="lead">Connectez-vous pour accéder à votre espace.</p><button class="btn" onclick="authM()">Connexion / Inscription</button>`);
setTimeout(async()=>{try{const j=await api('pay');$('#pl').innerHTML=j.payments.length?j.payments.map(p=>`<p>${dt(p.created)} · ${p.plan.toUpperCase()} · ${eur(p.amount)} · ${p.ref} · <b>${{pending:'en attente de vérification',confirmed:'confirmé',rejected:'refusé'}[p.status]}</b></p>`).join(''):'<p class="lead">Aucun paiement.</p>'}catch{}},0);
const act=S.u.until>Date.now()?S.u.plan:'basic';
return shell('ac',`<h2>Compte</h2><p class="lead">${esc(S.u.email)}${S.u.suspended?' · <b>suspendu</b>':''}</p><div class="card" style="--c1:#06d6f2;max-width:460px"><h3>Abonnement : ${S.pl[act].name}</h3><p>${act=='basic'?'Formule gratuite':'Actif jusqu\'au '+dt(S.u.until)+' (renouvellement manuel)'}</p><p>${S.pl[act].daily} messages / jour · ${S.pl[act].agents} agents</p></div><h2 style="font-size:22px;margin-top:24px">Paiements</h2><div id="pl">…</div><h2 style="font-size:22px;margin-top:24px">Formules</h2><div class="grid plans">${plans()}</div><p style="margin-top:20px"><button class="btn o" onclick="logout()">Déconnexion</button> ${S.u.role=='admin'?'<a class="btn" href="#/admin">Administration</a>':''}</p>`)};
const C0=chat;chat=function(id){cm=[];return C0(id)};
send=async function(e){e.preventDefault();const i=$('#in'),t=i.value.trim();if(!t||busy)return;if(!S.u){return authM('Connectez-vous pour discuter avec un agent.')}
i.value='';busy=true;add('u',md(t));cm.push({role:'user',content:t});hist.push({a:cur,t:t.slice(0,60)});const w=add('a','<span class="dots"><i></i><i></i><i></i></span>');
try{const j=await api('chat',{agent:cur,messages:cm});cm.push({role:'assistant',content:j.reply});w.innerHTML=md(j.reply)}catch(x){cm.pop();w.innerHTML='⚠️ '+esc(x.message)}busy=false};
const R0=route;route=function(){if(location.hash==='#/admin'){$('#r').innerHTML=S.u&&S.u.role=='admin'?shell('ac','<h2>Administration</h2><p class="lead">Chargement…</p>'):shell('ac','<h2>Accès refusé</h2>');if(S.u&&S.u.role=='admin')adm();return}R0()};
async function adm(){try{const d=await api('admin');window.D=d;const st=d.stats;
